<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(30, 41, 59, 0.12);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select, button {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font: inherit;
        }

        input, select {
            border: 1px solid #cbd5e1;
            background: white;
        }

        input:focus, select:focus {
            outline: 2px solid #818cf8;
            outline-offset: 2px;
        }

        .currencies {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 22px 0;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            margin-top: 24px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            color: #166534;
            background: #f0fdf4;
            padding: 16px;
            border-radius: 10px;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 16px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
<main class="card">
    <h1>Currency Converter</h1>
    <p class="subtitle">
        Enter an amount and choose your currencies.
    </p>

    <form id="converterForm">
        <label for="amount">Amount</label>
        <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="0.01"
                step="0.01"
                value="100"
                required
        >

        <div class="currencies">
            <div>
                <label for="from">From</label>
                <select id="from">
                    <option value="USD" selected>USD — US Dollar</option>
                    <option value="INR">INR — Indian Rupee</option>
                    <option value="EUR">EUR — Euro</option>
                    <option value="GBP">GBP — British Pound</option>
                    <option value="JPY">JPY — Japanese Yen</option>
                    <option value="AUD">AUD — Australian Dollar</option>
                    <option value="CAD">CAD — Canadian Dollar</option>
                    <option value="AED">AED — UAE Dirham</option>
                </select>
            </div>

            <div>
                <label for="to">To</label>
                <select id="to">
                    <option value="USD">USD — US Dollar</option>
                    <option value="INR" selected>INR — Indian Rupee</option>
                    <option value="EUR">EUR — Euro</option>
                    <option value="GBP">GBP — British Pound</option>
                    <option value="JPY">JPY — Japanese Yen</option>
                    <option value="AUD">AUD — Australian Dollar</option>
                    <option value="CAD">CAD — Canadian Dollar</option>
                    <option value="AED">AED — UAE Dirham</option>
                </select>
            </div>
        </div>

        <button type="submit" id="convertButton">Convert</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
</main>

<script>
    const form = document.getElementById("converterForm");
    const button = document.getElementById("convertButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const amount = document.getElementById("amount").value;
        const from = document.getElementById("from").value;
        const to = document.getElementById("to").value;

        if (!Number.isFinite(Number(amount)) || Number(amount) <= 0) {
            result.className = "error";
            result.textContent = "Please enter an amount greater than zero.";
            return;
        }

        button.disabled = true;
        button.textContent = "Converting...";
        result.className = "";
        result.textContent = "";

        try {
            const params = new URLSearchParams({ from, to, amount });

            // Calls your existing Spring Boot controller.
            const response = await fetch(`api/convert?${params}`, {
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) {
                throw new Error(
                    `Conversion failed (HTTP ${response.status}). Please try again.`
                );
            }

            const data = await response.json();

            result.className = "success";
            result.textContent =
                `${data.amount} ${data.from} = ` +
                `${data.convertedAmount} ${data.to}`;

            const rateLine = document.createElement("div");
            rateLine.textContent =
                `Exchange rate: 1 ${data.from} = ${data.rate} ${data.to}`;

            result.appendChild(rateLine);

        } catch (error) {
            result.className = "error";
            result.textContent = error.message ||
                "Unable to connect. Check that the application is running.";
        } finally {
            button.disabled = false;
            button.textContent = "Convert";
        }
    });
</script>
</body>
</html>
